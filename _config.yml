title: EECS 398
tagline: Practical Data Science archive at the University of Michigan
author: Practical Data Science course staff
url: "https://practicaldsc.org"
baseurl: ""

remote_theme: just-the-docs/just-the-docs@v0.9.0
color_scheme: um
search_enabled: false
nav_enabled: false
heading_anchors: true
